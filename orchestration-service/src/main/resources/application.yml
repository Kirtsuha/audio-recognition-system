spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:orchestration-service}
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "org.hse.musicrecognition.dto"
    producer:
      properties:
        spring.json.add.type.headers: false
    listener:
      missing-topics-fatal: false

fingerprint:
  service:
    url: ${FINGERPRINT_SERVICE_URL:http://fingerprint-service:8000}

ml-reranker:
  service:
    url: ${ML_RERANKER_SERVICE_URL:http://ml-reranker-service:8010}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minio}
  secret-key: ${MINIO_SECRET_KEY:minio123}

recognition:
  fingerprint:
    top-k: ${RECOGNITION_FINGERPRINT_TOP_K:20}
  storage:
    query-audio-bucket: ${RECOGNITION_QUERY_AUDIO_BUCKET:recognition-queries}
    query-audio-prefix: ${RECOGNITION_QUERY_AUDIO_PREFIX:debug}
    reference-audio-bucket: ${RECOGNITION_REFERENCE_AUDIO_BUCKET:full-tracks}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}