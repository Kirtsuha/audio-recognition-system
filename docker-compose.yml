version: "3.9"

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: fingerprint_user
      POSTGRES_PASSWORD: fingerprint_pass
      POSTGRES_DB: fingerprint_db
    ports:
      - "5432:5432"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  fingerprint-service:
    build: ./fingerprint-service
    depends_on:
      - postgres
      - minio
    environment:
      DATABASE_URL: postgresql://fingerprint_user:fingerprint_pass@postgres:5432/fingerprint_db
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: tracks
    ports:
      - "8000:8000"

  ml-service:
    build: ./ml-service
    depends_on:
      - minio
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: tracks
    ports:
      - "8010:8010"

  orchestration-service:
    build: ./orchestration-service
    depends_on:
      - fingerprint-service
      - ml-service
      - redis
    ports:
      - "8080:8080"