version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: music-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  fingerprint-service:
    build: ./fingerprint-service
    container_name: fingerprint-service
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://fingerprint_user:fingerprint_pass@postgres:5432/fingerprint_db
    ports:
      - "8000:8000"

  orchestration-service:
    build: ./orchestration-service
    container_name: orchestration-service
    depends_on:
      - postgres
      - fingerprint-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestration_db
      SPRING_DATASOURCE_USERNAME: orchestration_user
      SPRING_DATASOURCE_PASSWORD: orchestration_pass
      FINGERPRINT_SERVICE_URL: http://fingerprint-service:8000/index
    ports:
      - "8080:8080"

volumes:
  pgdata:
